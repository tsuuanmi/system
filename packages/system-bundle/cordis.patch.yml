# The system profile lists ONLY this bundle (no dsh-base, ADR-0019).
# Every DSH row here is on the allow-list in docs/architecture/plugin-model.md#dsh-core-reuse-map;
# adding one updates that table and the composition test. Telemetry rows are never inserted.
- insert:
    # --- DSH core (slice 1) ---
    - id: timer
      name: '@deepseek-ai/cordis-plugin-timer'
    - id: credentials
      name: '@tsuuanmi/system-credentials-vault'   # ctx.credentials, encrypted at rest
    - id: webserver
      name: '@deepseek-ai/dsh-host-webserver'
      config:
        host: 127.0.0.1                             # loopback only
        port: 47317
    # --- system kernel and edge ---
    - id: store
      name: '@tsuuanmi/system-store'
    - id: event-log
      name: '@tsuuanmi/system-event-log'
    - id: leases
      name: '@tsuuanmi/system-leases'
    - id: artifacts
      name: '@tsuuanmi/system-artifacts'
    # --- plugin host (core, B7): every row's plugin with the manifest its package declares, and each
    # plugin's lifecycle state, every change a decision. It reads the rows from the DSH loader at start,
    # records, and automates nothing: a row turned off is recorded `candidate`, never stopped by it. ---
    - id: plugin-host
      name: '@tsuuanmi/system-plugin-host'           # ctx.pluginHost; MCP status lists the plugins
    # --- resource ledger (core, B2): pools are the operator's configuration; none until configured ---
    - id: resources
      name: '@tsuuanmi/system-resources'             # ctx.resources; MCP resources_pools, resources_usage
      config:
        pools: []
    # --- approval queue (core, B5): the autonomy policy and the one batched queue; expiry denies ---
    - id: approvals
      name: '@tsuuanmi/system-approvals'             # ctx.approvals; MCP approvals_list/get/policy, approvals_decide and approvals_policy_propose (operator)
      config:
        # The default studio policy, conservative: a read runs; a workspace write runs once tests
        # and lint pass; every other action asks, and so does any class no rule names. A patch
        # that targets this row replaces its whole config, so it carries the policies too
        # (`system check` names a missing or invalid one; with none valid, nothing is approved).
        policies:
          - schema: 'autonomy-policy@1.0'
            id: studio-default
            version: 1
            scope: studio
            rules:
              - { actionClass: read, mode: auto }
              - { actionClass: workspace-write, mode: auto, requires: [tests, lint] }
              - { actionClass: merge, mode: ask }
              - { actionClass: command, mode: ask }
              - { actionClass: external-send, mode: ask }
              - { actionClass: deploy, mode: ask }
              - { actionClass: delete-data, mode: ask }
              - { actionClass: spend, mode: ask }
              - { actionClass: charter, mode: ask }
              - { actionClass: funding, mode: ask }
              - { actionClass: remediation, mode: ask }
              - { actionClass: policy-change, mode: ask }
            default: ask
            expiry: { defaultSeconds: 86400, maxSeconds: 1209600 }    # a day; at most 14 days
            batch: { maxSize: 10, maxWaitSeconds: 3600 }
    # --- provider runtime (M1) ---
    - id: accounts
      name: '@tsuuanmi/system-accounts'              # catalog is configured in the operator's profile patch
    - id: turn-receipts
      name: '@tsuuanmi/system-turn-receipts'
    - id: display
      name: '@tsuuanmi/system-display-virtual'       # Xvfb starts on the first turn, not at boot
    - id: browser
      name: '@tsuuanmi/system-browser-patchright'    # Chrome starts per account on demand
    - id: providers
      name: '@tsuuanmi/system-providers'
    - id: provider-chatgpt-web
      name: '@tsuuanmi/system-provider-chatgpt-web'  # UI map: ui/chatgpt-web.ui.yaml
    - id: provider-gemini-web
      name: '@tsuuanmi/system-provider-gemini-web'    # UI map: ui/gemini-web.ui.yaml
    - id: login
      name: '@tsuuanmi/system-login'                 # login profiles, Save, account_* MCP tools
    - id: egress
      name: '@tsuuanmi/system-egress'                # INV-12: classification policy + credential scan
    - id: workers
      name: '@tsuuanmi/system-workers'               # Worker registry, admission, deterministic router
    - id: turns
      name: '@tsuuanmi/system-turns'                 # the website Worker runtime (durable turns)
    # --- agent runtimes: Claude Code as the first Worker, on by default (PROP-0010 B3). Each run is
    # confined for reads by bubblewrap, and its commands by the SDK's sandbox (ADR-0024, ADR-0038);
    # a host without Claude Code, bubblewrap, or a sign-in still boots, and the probe says why its
    # Workers are unavailable. Codex stays off (PROP-0004): its Workers ask the tool gate through a
    # PreToolUse hook its probe proves on the host (ADR-0042), once the operator turns it on. ACP
    # stays off: it cannot ask a tool gate before each tool call, so no Worker of its is admitted. ---
    - id: agent-runtimes
      name: '@tsuuanmi/system-agent-runtimes'         # ctx.agentRuntimes and the read confinement
    - id: runtime-claude-agent-sdk
      name: '@tsuuanmi/system-runtime-claude-agent-sdk'   # runs the installed `claude`, in its own home
    - id: runtime-codex-sdk
      name: '@tsuuanmi/system-runtime-codex-sdk'      # Codex as a Worker (the operator's installed codex)
      disabled: true
    - id: runtime-acp
      name: '@tsuuanmi/system-runtime-acp'            # ACP agents (none until configured)
      disabled: true
    - id: agent-workers
      name: '@tsuuanmi/system-agent-workers'          # the `agents` Worker source
      config:
        # No Worker until the operator names a repository: a Worker's workspace is an absolute path,
        # and none is known here. The operator's patch adds a read-only reviewer and a writer with a
        # worktree per run (docs/operations/runbooks.md#agent-workers).
        workers: []
    # --- API and local models (M6e): routes on llm-pi-ai and the model catalog in the operator patch ---
    - id: llm
      name: '@deepseek-ai/dsh-llm'                    # ctx.llm: provider-neutral model calls
    - id: llm-pi-ai
      name: '@deepseek-ai/dsh-llm-pi-ai'              # provider routes (none until configured); keys by credential reference
    - id: models
      name: '@tsuuanmi/system-models'                 # ctx.models and the `models` Worker source (no models until configured)
    - id: worker-sessions
      name: '@tsuuanmi/system-worker-sessions'       # sessions, mailboxes, peer messages; MCP session_send/session_inbox
    - id: workflow
      name: '@tsuuanmi/system-workflow'              # the single engine; MCP ask/research/result/usage/explain
    # --- the board (B4): ctx.board and the board_* MCP tools. It asks for every approval through
    # ctx.approvals (the `approvals` row) and never decides one itself; with that row off or refused,
    # the board waits on its inject and is not mounted. Turned off on its own, runs work as before. ---
    - id: board
      name: '@tsuuanmi/system-board'
    # --- digests (B6, digest family): a cited digest@1.0 of raw artifacts, on request (MCP digests_request),
    # by a read-only Worker on the economy tier, quote-checked. It fails open: with no such Worker (the
    # agent rows off), a request is settled `bypassed` and recorded, and nothing waits on it. ---
    - id: digest
      name: '@tsuuanmi/system-digest'                # ctx.digests; MCP digests_request, digests_get
    # --- the baseline report (B8, surface): from recorded data only, over a period and one project or
    # every one; it reads the board, the queue, and the ledger, writes nothing, and no model writes it.
    # By default the last 7 days: the weekly investor report. Off, nothing else changes. ---
    - id: report
      name: '@tsuuanmi/system-report'                # MCP report; system report
    - id: profile-software-development
      name: '@tsuuanmi/system-profile-software-development'  # agent-review, for agent Workers; off until the operator turns it on
      disabled: true
    - id: profile-scientific-research
      name: '@tsuuanmi/system-profile-scientific-research'  # the research procedure (template with a deep variant, contracts, typed artifacts)
    # --- model gateways: off in the MVP composition (PROP-0004); Claude Code reaches system over MCP ---
    - id: gateway-anthropic
      name: '@tsuuanmi/system-gateway-anthropic'     # Claude Code → website Workers as its model (system claude-env)
      disabled: true
    - id: gateway-responses
      name: '@tsuuanmi/system-gateway-responses'     # Codex → website Workers as its model (system codex-env)
      disabled: true
    - id: web-ui
      name: '@tsuuanmi/system-web-ui'                # operator UI at /ui (system ui prints the link)
    - id: mcp-server
      name: '@tsuuanmi/system-mcp-server'
