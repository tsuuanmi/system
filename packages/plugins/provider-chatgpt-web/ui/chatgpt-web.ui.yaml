# ChatGPT Web UI map (ui-map@1.0, ADR-0021). Checked against the live site on 2026-10-11
# (docs/research/browser-interaction-and-self-healing.md#live-check-2026-10-11-signed-in-account-read-only).
# When the site changes, edit this file (and the fixture), not the driver code.
schema: ui-map@1.1
provider: chatgpt-web
uiRevision: '2026-10-11'
locales: [en]

elements:
  auth.login:
    description: Sign-in entry points shown to a signed-out visitor.
    candidates:
      - { role: button, name: { en: '^Log in$' } }
      - { role: link, name: { en: '^Log in$' } }
      - { role: heading, name: { en: '^Log in or sign up$' } }
      - { testId: login-button }

  mode.group:
    description: Chat / Work switch on the home page; Work spends the Codex quota.
    candidates:
      - { role: group, name: { en: '^Composer mode$' } }
  mode.chat:
    scope: mode.group
    candidates:
      - { role: button, name: { en: '^Chat$' }, exact: true }
    fingerprint: { role: button, name: { en: '^chat$' } }
  mode.work:
    scope: mode.group
    candidates:
      - { role: button, name: { en: '^Work$' }, exact: true }

  temporary.toggle:
    candidates:
      - { role: button, name: { en: '^Temporary chat$' } }
    fingerprint: { role: button, name: { en: 'temporary' } }
  temporary.off:
    candidates:
      - { role: button, name: { en: '^Turn off temporary chat$' } }

  composer.form:
    description: The composer. Live, two visible forms carry data-chatgpt-composer; only one holds the textbox.
    candidates:
      - { css: 'form[data-chatgpt-composer]:has([role="textbox"][contenteditable="true"])' }
      - { css: 'form:has([role="textbox"][contenteditable="true"])' }
  composer.input:
    scope: composer.form
    candidates:
      - { role: textbox, name: { en: '^Ask ChatGPT$' } }
      - { css: '[contenteditable="true"][data-composer-markdown]' }
      - { testId: prompt-textarea }
    fingerprint: { role: textbox }
  composer.send:
    scope: composer.form
    candidates:
      - { role: button, name: { en: '^Send( prompt)?$' } }
      - { testId: send-button }
    fingerprint: { role: button, name: { en: 'send|submit' }, nearRole: textbox }
  composer.stop:
    scope: composer.form
    candidates:
      - { role: button, name: { en: '^Stop' } }
      - { testId: stop-button }
  composer.voice:
    scope: composer.form
    candidates:
      - { role: button, name: { en: '^Start Voice$' } }
  composer.model:
    scope: composer.form
    candidates:
      - { role: button, name: { en: '^Select ChatGPT model$' } }

  composer.tools:
    description: The "+" button that opens tools (files, Web search, Deep research, apps).
    scope: composer.form
    candidates:
      - { role: button, name: { en: '^Add files and more$' } }
  composer.deep-research:
    description: The Deep research mention chip inserted into the composer (checked 2026-10-12).
    scope: composer.form
    candidates:
      - { css: '[data-prompt-link-href="app://connector_openai_deep_research"]' }
      - { css: '[app-mention-name="deep-research"]' }
      - { role: img, name: { en: '^Deep research$' } }
  tools.deep-research:
    description: The Deep research entry of the "+" tools popover (absent in Temporary chat).
    candidates:
      - { role: button, name: { en: '^Deep research\b' } }
    fingerprint: { role: button, name: { en: 'deep research' } }

  research.running:
    description: Deep research in progress, inside its nested report frame (live run 2026-10-12).
    frames: any
    candidates:
      - { role: button, name: { en: '^Stop research$' } }
      - { text: { en: '^Researching' } }
  research.completed:
    description: '"Research completed in <time> · <n> citations · <n> searches" above the report.'
    frames: any
    candidates:
      - { text: { en: '^Research completed' } }
  research.report-heading:
    description: The report starts after this heading, in the same frame.
    frames: any
    candidates:
      - { role: heading, name: { en: '^Deep Research Report$' } }
      - { text: { en: '^Deep Research Report$' } }

  model.menu:
    description: Opened by composer.model. Two views (checked 2026-10-12) - A, the Power slider plus a view toggle labelled with the level; B, after the toggle, the model radios.
    candidates:
      - { role: menu, name: { en: '^Select ChatGPT model$' } }
  model.view-toggle:
    description: Switches the model menu between the Power view and the model list.
    scope: model.menu
    candidates:
      - { css: '[data-model-picker-view-toggle]' }
  model.option:
    description: One radio per model (view B); the accessible name starts with the model name.
    scope: model.menu
    cardinality: many
    candidates:
      - { role: menuitemradio }
  model.power:
    description: The Power slider; ArrowRight/ArrowLeft step through the levels.
    scope: model.menu
    candidates:
      - { role: menuitem, name: { en: '^Power$' } }
      - { css: '[data-reasoning-slider]' }
  model.power-status:
    description: 'Reads "<level>, <n> of <total>."'
    scope: model.menu
    candidates:
      - { role: status }

  turn.user:
    description: One heading per user turn.
    cardinality: many
    candidates:
      - { role: heading, name: { en: '^You said:?$' } }
  turn.assistant:
    description: One heading per assistant turn; the answer is the heading's container.
    cardinality: many
    candidates:
      - { role: heading, name: { en: '^ChatGPT said:?$' } }
  turn.assistant.done:
    description: Present under every finished answer.
    cardinality: many
    candidates:
      - { role: button, name: { en: '^Copy$' }, exact: true }

actions:
  mode.select-chat:
    do: click
    target: mode.chat
    verify: { attr: { of: mode.chat, name: aria-pressed, equals: 'true' } }
    sideEffect: reversible
    heal: deterministic
    timeouts: { resolveMs: 5000, verifyMs: 3000 }
  temporary.enable:
    do: click
    target: temporary.toggle
    verify: { anyOf: [{ url: 'temporary-chat=true' }, { visible: temporary.off }] }
    sideEffect: reversible
    heal: deterministic
    timeouts: { resolveMs: 5000, verifyMs: 5000 }
  model.open:
    do: click
    target: composer.model
    verify: { visible: model.menu }
    sideEffect: reversible
    heal: deterministic
    timeouts: { resolveMs: 5000, verifyMs: 5000 }
  model.show-models:
    do: click
    target: model.view-toggle
    verify: { visible: model.option }
    sideEffect: reversible
    timeouts: { resolveMs: 3000, verifyMs: 3000 }
  tools.open:
    do: click
    target: composer.tools
    verify: { visible: tools.deep-research }
    sideEffect: reversible
    heal: deterministic
    timeouts: { resolveMs: 5000, verifyMs: 5000 }
  tools.deep-research:
    do: click
    target: tools.deep-research
    verify: { visible: composer.deep-research }
    sideEffect: reversible
    heal: deterministic
    timeouts: { resolveMs: 5000, verifyMs: 5000 }
  composer.insert:
    do: insertText
    target: composer.input
    require: [editable]
    # The engine reads the text back; Send's label is not part of this check, so a renamed Send cannot fail it.
    verify: { visible: composer.input }
    sideEffect: none
    heal: deterministic
    timeouts: { resolveMs: 15000, verifyMs: 5000 }
  composer.send:
    do: click
    target: composer.send
    require: [enabled]
    fallback: { press: Enter, on: composer.input }
    verify: { anyOf: [{ network: conversation.post }, { countIncreased: turn.user }, { visible: composer.stop }] }
    sideEffect: irreversible
    heal: deterministic
    timeouts: { resolveMs: 5000, verifyMs: 20000 }

network:
  conversation.post: { method: POST, url: '/backend-api/f/conversation$' }
  account.me: { method: GET, url: '/backend-api/me$' }
  conversation.too-large: { url: '/backend-api/f/conversation$', status: 413 }
  challenge: { url: '.*', header: { name: cf-mitigated, equals: challenge } }

states:
  auth.signed-in: { visible: composer.input }
  auth.signed-out: { anyOf: [{ url: '^https?://auth\.openai\.com/|/auth/login' }, { visible: auth.login }] }
  turn.running: { visible: composer.stop }
  turn.idle: { allOf: [{ hidden: composer.stop }, { anyOf: [{ visible: composer.send }, { visible: composer.voice }] }] }

errors:
  - { when: { state: auth.signed-out }, kind: reauth_required, message: 'chatgpt-web: signed out' }
  - { when: { network: challenge }, kind: challenge, message: 'chatgpt-web: challenge page' }
  - { when: { network: conversation.too-large }, kind: invalid_input, message: 'chatgpt-web: message too long' }
