# Gemini Web UI map (ui-map@1.1, ADR-0021). Read live on 2026-10-12 from a signed-in account's
# /app page (read-only, Temporary-chat prompts, and one Deep research run); the fake site in
# fixtures/ follows it.
# When the site changes, edit this file (and the fixture), not the driver code.
schema: ui-map@1.1
provider: gemini-web
uiRevision: '2026-10-12'
locales: [en]

elements:
  auth.login:
    description: Sign-in entry points shown to a signed-out visitor.
    candidates:
      - { role: link, name: { en: '^Sign in$' } }
      - { role: button, name: { en: '^Sign in$' } }
  auth.account:
    description: "The signed-in Google account's button; its name carries the account (Google Account, then the name and email)."
    candidates:
      - { role: link, name: { en: '^Google Account:' } }
      - { role: button, name: { en: '^Google Account:' } }

  tab.any:
    description: The Chat / Spark tabs; Spark is the agent, never used for turns. Some layouts show no tabs.
    cardinality: many
    candidates:
      - { css: 'button[data-test-id^="app-tab-"]' }
  tab.chat:
    candidates:
      - { css: 'button[data-test-id="app-tab-chat"]' }
      - { role: button, name: { en: '^Chat$' }, exact: true }
  tab.chat-active:
    description: The Chat tab while it is the active one (only its class shows it).
    candidates:
      - { css: 'button[data-test-id="app-tab-chat"].app-tab--active' }

  temporary.toggle:
    description: An icon button with no pressed state.
    candidates:
      - { role: button, name: { en: '^Temporary chat$' } }
  temporary.notice:
    description: The only sign that Temporary chat is on ("Temporary chats don't appear in recent chats ...").
    candidates:
      - { text: { en: 'appear in recent chats' } }

  composer.input:
    candidates:
      - { role: textbox, name: { en: '^Enter a prompt for Gemini$' } }
      - { css: 'rich-textarea [contenteditable="true"]' }
  composer.send:
    candidates:
      - { role: button, name: { en: '^Send message$' } }
  composer.stop:
    candidates:
      - { role: button, name: { en: '^Stop response$' } }
  composer.mode:
    description: The mode picker ("Open mode picker, currently Flash"); some accounts have none.
    candidates:
      - { css: '[data-test-id="bard-mode-menu-button"]' }
      - { role: button, name: { en: '^Open mode picker' } }

  composer.tools:
    description: The "+" button that opens uploads and tools.
    candidates:
      - { role: button, name: { en: '^Upload & tools$' } }
  tools.more:
    description: Reveals more tools (Deep research, Guided learning) in the tools menu.
    candidates:
      - { css: '[data-test-id="more-tools-button"]' }
      - { role: button, name: { en: '^More tools$' } }
  tools.deep-research:
    description: The Deep research entry, offered in a normal chat only (never in a Temporary chat).
    candidates:
      - { role: menuitemcheckbox, name: { en: '^Deep research' } }
  composer.deep-research:
    description: The chip shown in the composer while Deep research is chosen; a reopened Deep research conversation still shows it.
    candidates:
      - { role: button, name: { en: '^Deselect Deep research$' } }

  research.start:
    description: >-
      The plan's "Start research" (Deep research first replies with a plan, which already has
      Copy). A started plan keeps its button, disabled, so only an enabled one counts.
    candidates:
      - { css: 'button[aria-label="Start research"]:not([disabled])' }
  research.running:
    description: 'The research card while it works ("Starting research...", "Writing your report...").'
    cardinality: many
    candidates:
      - { css: 'gem-processing-card.processing' }
  research.completed:
    description: The research card once the report is done; clicking it opens the report panel.
    cardinality: many
    candidates:
      - { css: 'gem-processing-card.completed' }
  research.panel:
    description: The report panel, opened beside the chat.
    candidates:
      - { css: 'deep-research-immersive-panel' }
  research.report:
    description: The report itself, without the panel's toolbar.
    scope: research.panel
    candidates:
      - { css: '#extended-response-message-content' }
      - { css: 'message-content' }
  research.source:
    description: One link per source used ("Sources used in the report"; the sources read but not used come after).
    scope: research.panel
    cardinality: many
    candidates:
      - { css: '[data-test-id="used-sources-button"] + * a[data-test-id="browse-web-item-link"]' }
  research.source-title:
    description: The source's title, inside its link.
    candidates:
      - { css: '[data-test-id="sub-title"]' }

  mode.menu:
    description: One menu holding the models and the thinking levels.
    candidates:
      - { css: '[role="menu"]:has([data-test-id^="bard-mode-option-"])' }
  mode.model:
    description: 'One item per model; its first line is the name ("3.8 Flash"), then a note. The chosen one is mode.model.selected.'
    scope: mode.menu
    cardinality: many
    candidates:
      - { css: '[role="menuitem"][data-test-id^="bard-mode-option-"]' }
  mode.level:
    description: 'One item per thinking level ("Low", "Medium", "High"), each name followed by its note, under a "Thinking level" item; the chosen one is mode.level.selected.'
    scope: mode.menu
    cardinality: many
    candidates:
      - { css: '[role="menuitem"]:not([data-test-id^="bard-mode-option-"])' }
  mode.model.selected:
    scope: mode.menu
    candidates:
      - { css: '[role="menuitem"][data-test-id^="bard-mode-option-"].selected' }
  mode.level.selected:
    scope: mode.menu
    candidates:
      - { css: '[role="menuitem"]:not([data-test-id^="bard-mode-option-"]).selected' }

  turn.user:
    cardinality: many
    candidates:
      - { css: 'user-query' }
      - { role: heading, name: { en: '^You said' } }
  turn.user.text:
    description: The prompt's paragraphs inside a turn.user; its heading ("You said") repeats the prompt shortened.
    cardinality: many
    candidates:
      - { css: 'p' }
  turn.assistant:
    description: One per answer; the heading "Gemini said" is inside it, the text in answer.content.
    cardinality: many
    candidates:
      - { css: 'model-response' }
  answer.content:
    description: The rendered answer inside a turn.assistant.
    candidates:
      - { css: 'message-content' }
  turn.assistant.done:
    description: The answer's own Copy, present under every finished answer (a code block's is "Copy code").
    cardinality: many
    candidates:
      - { role: button, name: { en: '^Copy$' }, exact: true }

actions:
  tab.select-chat:
    do: click
    target: tab.chat
    verify: { visible: tab.chat-active }
    sideEffect: reversible
    timeouts: { resolveMs: 5000, verifyMs: 3000 }
  temporary.enable:
    do: click
    target: temporary.toggle
    verify: { visible: temporary.notice }
    sideEffect: reversible
    timeouts: { resolveMs: 5000, verifyMs: 5000 }
  tools.open:
    do: click
    target: composer.tools
    verify: { anyOf: [{ visible: tools.more }, { visible: tools.deep-research }] }
    sideEffect: reversible
    timeouts: { resolveMs: 5000, verifyMs: 5000 }
  tools.show-more:
    do: click
    target: tools.more
    verify: { visible: tools.deep-research }
    sideEffect: reversible
    timeouts: { resolveMs: 3000, verifyMs: 3000 }
  tools.deep-research:
    do: click
    target: tools.deep-research
    verify: { visible: composer.deep-research }
    sideEffect: reversible
    timeouts: { resolveMs: 3000, verifyMs: 5000 }
  composer.clear-deep-research:
    do: click
    target: composer.deep-research
    verify: { hidden: composer.deep-research }
    sideEffect: reversible
    timeouts: { resolveMs: 3000, verifyMs: 3000 }
  research.start:
    # Starts the research the plan describes; the plan's prompt is already sent.
    do: click
    target: research.start
    require: [enabled]
    verify: { anyOf: [{ visible: research.running }, { visible: research.completed }] }
    sideEffect: irreversible
    timeouts: { resolveMs: 5000, verifyMs: 30000 }
  mode.open:
    do: click
    target: composer.mode
    verify: { visible: mode.model }
    sideEffect: reversible
    timeouts: { resolveMs: 5000, verifyMs: 5000 }
  composer.insert:
    do: insertText
    target: composer.input
    require: [editable]
    verify: { visible: composer.input }
    sideEffect: none
    timeouts: { resolveMs: 15000, verifyMs: 5000 }
  composer.send:
    do: click
    target: composer.send
    require: [enabled]
    verify: { anyOf: [{ countIncreased: turn.user }, { visible: composer.stop }] }
    sideEffect: irreversible
    timeouts: { resolveMs: 5000, verifyMs: 20000 }

states:
  auth.signed-in: { visible: auth.account }
  auth.signed-out: { anyOf: [{ url: '^https?://accounts\.google\.com/' }, { visible: auth.login }] }
  turn.running: { visible: composer.stop }

errors:
  - { when: { state: auth.signed-out }, kind: reauth_required, message: 'gemini-web: signed out' }
