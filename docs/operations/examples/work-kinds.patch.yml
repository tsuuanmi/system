# Route work by kind (operator decisions D35 and D36, 2026-10-24, and the operator's request of
# 2026-10-25; ADR-0057, accepted, and its amendment), on the live install's hand-named agent Workers
# (runbook: Route work by kind, docs/operations/runbooks.md#route-work-by-kind; on accounts x roles,
# the same kinds go on the roles, as the runbook shows).
#
#   changing the codebase -> Claude Code           (a writer given `code`, `docs`, and `tests`)
#   checks and tests      -> Codex CLI             (a Worker given `validation`: it runs them, changes nothing)
#   brainstorm          -> website Workers         (unchanged; see the runbook for the CLIs)
#   reviews             -> any reviewer given no kinds (Claude Code, Codex, Antigravity CLI)
#   digests             -> claude-digest, the one read-only Worker on the economy tier (T99 D5)
#
# Merge by row id into ~/.dsh/profiles/system/cordis.patch.yml: each row here replaces the live
# patch's row of that id (a patch that targets a row replaces its whole config). Every other row of
# the live patch stays as it is (accounts, login, workers, provider-gemini-web, workflow, turns,
# llm-pi-ai, models). Then `system check`, `system shutdown`, `system start`.

# D35 turns Codex back on (D34 had it off); since 2026-10-25 it runs the checks and tests. Its executable is the npm install
# under the Workers' tools directory, which the read confinement binds back read-only.
- id: runtime-codex-sdk
  disabled: false   # D35; was true (D34)
  config:
    executable: /home/tan/.dsh/system/tools/codex/node_modules/.bin/codex

# D35 turns the Antigravity CLI back on. It reviews (any review step, given no kinds); it writes no
# docs or tests here: `algorithm-development`'s writing step keeps a conversation, which agy cannot
# resume, and its validation runs commands, which agy has none of (runbook: Route work by kind).
- id: runtime-antigravity-cli
  disabled: false   # D35; was true (D34)
  config:
    executable: /home/tan/.local/bin/agy

# The agent Workers. This list replaces the whole list.
#
# Every Worker on /home/tan/workspaces/system sets `worktreePerRun: true`: a writer works in each
# workflow run's own git worktree (branch system/run/<runId>), never in the checkout, and a reviewer
# must read the tree it reviews, so the load refuses Workers of one workspace that disagree.
# claude-member works in its own empty directory, never a worktree, so it keeps it off.
#
# What gates a writer's commands (ADR-0038): the bundle's studio policy, which this patch does not
# change (no `approvals` row). Reads and edits run (`read`, `workspace-write: auto`, with `tests` and
# `lint` required at acceptance, so every result waits for the operator's review); every command
# (`Bash` for Claude Code, Codex's shell) is a `command`, which asks: in a step with a session
# (develop:1) it waits on the approval queue, in one without (review:1) it is denied and reported
# not run. The policy lists no command, so nothing runs unasked. See the runbook before listing one:
# a run's fresh worktree has no node_modules and the Worker has no network.
- id: agent-workers
  config:
    workers:
      # D36: writes the system repository, a worktree per run; 2026-10-25: every change to it, source
      # code, docs, and tests (algorithm-development with no variant, and its `docs` and `tests`
      # variants). Its commands run in Claude Code's own sandbox, confined to the worktree with no
      # network, once the probe proves both confinements on this host (`executes`); until then it
      # writes nothing.
      - id: claude-code
        runtime: claude-agent-sdk
        workspace: /home/tan/workspaces/system
        sandbox: workspace-write
        tier: standard
        worktreePerRun: true
        kinds: [code, docs, tests]
      # 2026-10-25: runs the checks and tests (`validation` work) and changes nothing; it takes no
      # writing step. Since T267 algorithm-development has no `validate:1` (its author runs the checks),
      # so this Worker takes no step of that template. Its commands run in Codex's own sandbox inside the
      # confinement. It stays workspace-write: only such a Worker proves `validate`. Give no other
      # Worker `validation`, or list it on one more to share the validations.
      - id: codex-writer
        runtime: codex-sdk
        workspace: /home/tan/workspaces/system
        sandbox: workspace-write
        tier: standard
        worktreePerRun: true
        kinds: [validation]
      # The reviewers: given no kinds, they take every step on their tier that names none (each
      # algorithm-development review, agent-review, a planner's steps), and never a kinded step they
      # cannot do (they are read-only: no develop, no validate). They are on the standard tier, so
      # none takes a digest, which asks for the economy tier only (docs/design/digests.md#the-worker).
      - id: claude-research   # renamed from claude-review (operator, 2026-10-24)
        runtime: claude-agent-sdk
        workspace: /home/tan/workspaces/system
        sandbox: read-only
        tier: standard
        maxTurns: 4
        worktreePerRun: true   # was off: a writer now shares the workspace
      - id: codex-review
        runtime: codex-sdk
        workspace: /home/tan/workspaces/system
        sandbox: read-only
        tier: standard
        worktreePerRun: true   # was off
      - id: agy-review
        runtime: antigravity-cli
        workspace: /home/tan/workspaces/system
        sandbox: read-only
        model: "<standard model>"                # its model's name, in the live profile only (ADR-0073)
        tier: standard
        worktreePerRun: true   # was off
      # T99 D5: the digests of a task's results. A digest asks for a read-only Worker on the digest
      # row's tier (economy) as both minimum and maximum, and once more on standard only when every
      # economy claim fails the quote check; with no economy Worker, every digest is bypassed. Its
      # sources come in its brief, so it needs no repository: it works in the review member's empty
      # directory, never a worktree. Given no kinds, and on the economy tier, it takes no step that
      # asks for standard: no algorithm-development review, and an agent-review only when its caller
      # asks for economy. To make it cheaper than a reviewer, give it the
      # runtime's lighter model with `model:`; otherwise it runs the runtime's default model.
      - id: claude-digest
        runtime: claude-agent-sdk
        workspace: /home/tan/experiments/review-member/empty
        sandbox: read-only
        tier: economy
        maxTurns: 4
        description: Writes the cited digests of task results
      # A review team member (ADR-0049) in an empty directory outside the repository; unchanged.
      - id: claude-member
        runtime: claude-agent-sdk
        workspace: /home/tan/experiments/review-member/empty
        sandbox: read-only
        tier: standard
        reviewMember: true
        family: claude-agent-sdk
    # D33, unchanged from the live patch.
    providers:
      - provider: claude-agent-sdk
        accounts: pooled
        pooledTerms:
          confirmedBy: operator
          confirmedAt: "2026-10-24T07:44:00+07:00"
          terms: "Not a reading that Anthropic's plan terms allow pooling. Operator decision D33 (2026-10-24): move work between the operator's own personal accounts of this provider when one is busy or at its limit; the operator accepts the risk under the personal-plan terms."

# The algorithm-development template, whose steps name their kinds: on, as in the live patch (D30).
# `kinds` here are the shipped ones, written out: change one to move that step to the Workers given
# the new kind (`develop: docs` would hand the code changes to the Workers given `docs`). A
# `validate` key is retired (T267: the template has no validate step) and is ignored; leave it out.
- id: profile-software-development
  disabled: false
  config:
    kinds:
      develop: code
      docs: docs
      tests: tests
