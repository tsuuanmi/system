packages:
  - "schemas"
  - "packages/*"
  - "packages/plugins/*"
allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': false
  '@google/genai': false
  esbuild: true
  koffi: false
  node-pty: false
  protobufjs: false
# The Claude Agent SDK bundles a platform build of Claude Code (~250 MB each); the
# runtime-claude-agent-sdk provider runs the operator's installed `claude` instead.
ignoredOptionalDependencies:
  - '@anthropic-ai/claude-agent-sdk-linux-x64'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64'
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64'
  - '@anthropic-ai/claude-agent-sdk-win32-x64'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64'
  # The Codex SDK likewise pulls in every platform build of Codex (~430 MB); runtime-codex-sdk runs
  # the operator's installed `codex`.
  - '@openai/codex-linux-x64'
  - '@openai/codex-linux-arm64'
  - '@openai/codex-darwin-x64'
  - '@openai/codex-darwin-arm64'
  - '@openai/codex-win32-x64'
  - '@openai/codex-win32-arm64'
# Each override lifts a dependency to its patched release within every dependent's
# declared range; why, and what is not forced, is in docs/engineering/dependencies.md#overrides.
overrides:
  body-parser: ^2.4.0
  fast-uri: ^3.1.9
  fflate: '>=0.8.3'
  ip-address: ^10.7.4
  undici: ^8.12.2
  zod: ^4.6.6
patchedDependencies:
  patchright-core@1.63.0: patches/patchright-core@1.63.0.patch
