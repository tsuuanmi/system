packages:
  - "packages/*"
# No dependency install scripts run (supply-chain review, ADR-0001). The DSH
# subprocess postinstall only restores node-pty's helper bit; System uses no PTY.
allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': false
  '@google/genai': false
  koffi: false
  node-pty: false
  protobufjs: false
  # The pinned pnpm that `dsh plugin` runs works without its install script.
  pnpm: false
# Dependency fixes and why: patches/README.md.
patchedDependencies:
  '@deepseek-ai/dsh-app-boot@0.2.2-rc.1': patches/@deepseek-ai__dsh-app-boot@0.2.2-rc.1.patch
  '@deepseek-ai/dsh-storage-sqlite@0.2.2-rc.1': patches/@deepseek-ai__dsh-storage-sqlite@0.2.2-rc.1.patch
  '@deepseek-ai/dsh@0.2.2-rc.1': patches/@deepseek-ai__dsh@0.2.2-rc.1.patch
# Transitive security fixes, scoped to the vulnerable ranges: patches/README.md.
overrides:
  '@modelcontextprotocol/client@>=2.0.0 <2.3.0': 2.3.0
  'undici@>=8.0.0 <8.12.2': 8.12.2
  'zod@<4.6.6': 4.6.6
