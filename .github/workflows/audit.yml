name: audit

# Its own workflow: one run outside the Node matrix, so a new advisory or a registry
# outage shows as this check alone and never hides the test results. Daily, so an
# advisory published against an unchanged lockfile is still seen.
on:
  push:
    branches: [main]
  pull_request:
  # The release workflow gates a tag on it too.
  workflow_call:
  schedule:
    - cron: '41 5 * * *'

permissions:
  contents: read

jobs:
  audit:
    name: dependency audit (production, high and critical)
    runs-on: ubuntu-24.04  # pinned: a new image can change the user-namespace policy bubblewrap needs
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: pnpm audit:deps
