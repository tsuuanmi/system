name: release

# A `v<version>` tag on main cuts a GitHub release (ADR-0026,
# docs/engineering/releasing.md). Cheap checks run first, then every CI gate and the
# dependency audit on the tagged commit. The release carries the package tarballs, one CycloneDX SBOM per
# package, and SHA256SUMS; the tarballs and SBOMs get one build provenance
# attestation. Nothing is published to npm.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: the tag is on main and names a releasable version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0  # main for the ancestor check, earlier tags for the DSH pin check
          persist-credentials: false
      - name: the tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: one version, the tag's, with a changelog entry and DSH pins a patch may keep
        run: node scripts/release-artifacts.ts --verify --tag "$GITHUB_REF_NAME"

  gates:
    needs: verify
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  audit:
    needs: verify
    uses: ./.github/workflows/audit.yml
    permissions:
      contents: read

  release:
    needs: [gates, audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The owner can require a reviewer for this environment in the repository settings.
    environment: release
    permissions:
      contents: write      # create the GitHub release
      id-token: write      # sign the provenance attestation
      attestations: write  # store it
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0  # earlier tags for the DSH pin check
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: tarballs, SBOMs, checksums, notes
        run: pnpm release:artifacts --tag "$GITHUB_REF_NAME"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/release/*.tgz
            dist/release/*.cdx.json
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME"
          --notes-file dist/release-notes.md dist/release/*
