name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: node ${{ matrix.node }} / check + test + e2e
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: real display and browser for provider-runtime tests
        run: |
          command -v Xvfb || (sudo apt-get update && sudo apt-get install -y xvfb)
          google-chrome --version
      - run: pnpm check
      - run: pnpm test
        env:
          SYSTEM_REQUIRE_BROWSER: '1'
      - run: pnpm test:e2e
