name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: node ${{ matrix.node }} / check + test + e2e
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor of the supported range (CON-2), and the latest of each line.
        node: ['24.18.1', '24', '26']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: real display, browser, and bubblewrap for provider-runtime and agent tests
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb tigervnc-scraping-server bubblewrap
          # Ubuntu 23.10+ restricts unprivileged user namespaces, which bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          google-chrome --version
          bwrap --dev-bind / / -- true
      - run: pnpm check
      - run: pnpm test
        env:
          SYSTEM_REQUIRE_BROWSER: '1'
          SYSTEM_REQUIRE_BWRAP: '1'
      - run: pnpm test:e2e
      - name: crash injection (SIGKILL at each reconcile point of a turn)
        run: pnpm test:crash
